    <style>
      /* Minimal reset — matches MUI defaults so skeleton blends in */
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        background: #f5f7f5;
        font-family: "Roboto", "Helvetica", "Arial", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #121212; }
        .hs-appbar  { background: #1e1e1e !important; border-color: #2c2c2c !important; }
        .hs-shimmer { background: #2c2c2c !important; }
        .hs-shimmer::after { background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent) !important; }
        .hs-card    { background: #1e1e1e !important; border-color: #2c2c2c !important; }
      }

      /* AppBar */
      .hs-appbar {
        position: sticky; top: 0; z-index: 100;
        background: #ffffff;
        border-bottom: 1px solid #e0e0e0;
        height: 64px;
        display: flex; align-items: center;
        padding: 0 16px;
      }

      /* Shimmer animation */
      @keyframes hs-shimmer {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      .hs-shimmer {
        position: relative; overflow: hidden;
        background: #e0e0e0;
        border-radius: 6px;
      }
      .hs-shimmer::after {
        content: '';
        position: absolute; inset: 0;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
        animation: hs-shimmer 1.4s ease-in-out infinite;
      }

      /* Content area */
      .hs-content {
        max-width: 900px;
        margin: 0 auto;
        padding: 12px 12px 80px;
      }
      @media (min-width: 600px) {
        .hs-content { padding: 24px 24px 80px; }
      }

      /* Card */
      .hs-card {
        background: #fff;
        border: 1px solid #e0e0e0;
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 12px;
      }

      /* Bottom nav */
      .hs-bottom-nav {
        position: fixed; bottom: 0; left: 0; right: 0;
        height: 56px;
        background: #fff;
        border-top: 1px solid #e0e0e0;
        display: flex; align-items: center; justify-content: space-around;
        z-index: 100;
      }
      @media (prefers-color-scheme: dark) {
        .hs-bottom-nav { background: #1e1e1e; border-color: #2c2c2c; }
      }
      .hs-bottom-nav-item {
        display: flex; flex-direction: column; align-items: center; gap: 2px;
        flex: 1;
      }
    </style>
  </head>
